name: AI Agent Automation Cron Job

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code từ GitHub
      uses: actions/checkout@v4

    - name: Cài đặt Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Cài đặt thư viện và Playwright browser
      run: |
        python -m pip install --upgrade pip
        pip install \
          playwright \
          litellm \
          python-dotenv \
          gspread \
          google-auth \
          langchain-openai \
          browser-use
        python -m playwright install --with-deps chromium

    - name: Tạo file Google credentials từ Secret
      env:
        GOOGLE_CREDS_JSON: ${{ secrets.GOOGLE_CREDS_JSON }}
      run: |
        echo "$GOOGLE_CREDS_JSON" > google_creds.json

    - name: Chạy AI Agent
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
      run: |
        python browser_agent_sheets.py

    - name: Dọn dẹp file nhạy cảm
      if: always()
      run: |
        rm -f google_creds.json
