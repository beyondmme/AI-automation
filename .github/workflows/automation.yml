name: AI Agent Automation Cron Job

on:
  schedule:
    - cron: '0 0 * * *' # Tự động chạy ngầm mỗi ngày
  workflow_dispatch: # Cho phép bạn bấm nút Test thủ công bất cứ lúc nào

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code từ GitHub
        uses: actions/checkout@v3

      - name: Cài đặt Python môi trường Cloud
        uses: actions/setup-python@v4
        with:
          python-cache-dependency-path: ""
          python-version: '3.11'

      - name: Cài đặt các thư viện cần thiết
        run: |
          python -m pip install --upgrade pip
          pip install langchain-groq browser-use gspread google-auth python-dotenv

      - name: Chạy file script AI Agent với API Key bảo mật tuyệt đối
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          echo '${{ secrets.GOOGLE_CREDS_JSON }}' > google_creds.json
          python browser_agent_sheets.py
