name: AI Agent Automation Cron Job

on:
  schedule:
    - cron: '0 */12 * * *'   # Chạy mỗi 12 tiếng: 00:00 và 12:00 UTC
  workflow_dispatch:           # Cho phép bấm nút chạy thủ công trên GitHub web

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code từ GitHub
      uses: actions/checkout@v4   # FIX: dùng v4 thay v3 (v3 sắp deprecated)

    - name: Cài đặt Python
      uses: actions/setup-python@v5   # FIX: dùng v5 thay v4
      with:
        python-version: '3.11'

    - name: Cài đặt các thư viện cần thiết
      run: |
        python -m pip install --upgrade pip
        pip install \
          litellm \
          python-dotenv \
          gspread \
          google-auth \
          langchain-openai \
          browser-use

    - name: Cài đặt Playwright browser (Chromium)
      run: |
        playwright install --with-deps chromium
        # FIX: --with-deps cài thêm các system library cần thiết trên Ubuntu
        # Thiếu flag này thường gây lỗi "browser executable not found"

    - name: Tạo file Google credentials từ Secret
      env:
        # FIX: dùng env var thay vì echo trực tiếp
        # Cách cũ: echo '${{ secrets.GOOGLE_CREDS_JSON }}' > google_creds.json
        # → bị lỗi nếu JSON chứa ký tự đặc biệt như dấu nháy đơn
        GOOGLE_CREDS_JSON: ${{ secrets.GOOGLE_CREDS_JSON }}
      run: |
        echo "$GOOGLE_CREDS_JSON" > google_creds.json
        echo "✅ Đã tạo google_creds.json"

    - name: Chạy AI Agent
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        # Nếu bạn dùng Gemini thì thêm:
        # GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        python browser_agent_sheets.py

    - name: Dọn dẹp file nhạy cảm
      if: always()   # Chạy kể cả khi bước trước bị lỗi
      run: |
        rm -f google_creds.json
        echo "✅ Đã xóa file credentials tạm"
