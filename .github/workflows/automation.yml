name: AI Agent Automation Cron Job

# Thiết lập lịch chạy tự động (Ví dụ: Cứ mỗi 12 tiếng chạy 1 lần)
on:
  schedule:
    - cron: '0 */12 * * *'  
  workflow_dispatch: # Cho phép bạn bấm nút chạy thủ công bất kỳ lúc nào trên web

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code từ GitHub
      uses: actions/checkout@v3

    - name: Cài đặt Python môi trường Cloud
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Cài đặt các thư viện cần thiết
      run: |
        python -m pip install --upgrade pip
        pip install litellm python-dotenv gspread google-auth browser-use playwright
        playwright install

    - name: Chạy file script AI Agent với API Key bảo mật tuyệt đối
      env:
        # Lấy trực tiếp key từ khu vực mã hóa GitHub Secrets đưa vào môi trường ảo lúc chạy
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      run: |
        # Đoạn script này tạo lại file json tạm thời từ Secret để code Python đọc được
        echo '${{ secrets.GOOGLE_CREDS_JSON }}' > google_creds.json
        
        # Chạy file script của bạn
        python browser_agent_sheets.py
